<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode | default `zh-cn` }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    {{ with .OutputFormats.Get "RSS" }}
      <link rel="alternate" type="{{ .MediaType.Type }}" title="{{ site.Title }} RSS" href="{{ .RelPermalink }}">
    {{ end }}
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div>
          <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
          {{ with site.Params.description }}
            <p class="site-description">{{ . }}</p>
          {{ end }}
        </div>
        <nav class="site-nav" aria-label="主导航">
          {{ range site.Menus.main }}
            <a href="{{ .URL | relLangURL }}">{{ .Name }}</a>
          {{ end }}
          {{ with site.Home.OutputFormats.Get "RSS" }}
            <a href="{{ .RelPermalink }}">RSS</a>
          {{ end }}
        </nav>
      </header>

      <main class="site-main">
        {{ block "main" . }}{{ end }}
      </main>

      <footer class="site-footer">
        <p>由 Hugo 驱动，部署于 GitHub Pages。</p>
      </footer>
    </div>
  </body>
</html>
